<svg xmlns="http://www.w3.org/2000/svg" width="628" height="408" viewBox="0 0 628 408" fill="none">
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a233a"/>
      <stop offset="100%" stop-color="#0b0e18"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="none"/>
      <rect y="2" width="4" height="2" fill="#000000" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <style>
    text { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .cur { animation: blink 1.05s steps(1, end) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <!-- Window fill & 2px Win95 bevel -->
  <rect width="628" height="408" fill="#121320"/>
  <rect x="0" y="0" width="628" height="2" fill="#273047"/>
  <rect x="0" y="0" width="2" height="408" fill="#273047"/>
  <rect x="0" y="406" width="628" height="2" fill="#06070c"/>
  <rect x="626" y="0" width="2" height="408" fill="#06070c"/>

  <!-- 36px Titlebar matching rain_window.gif -->
  <rect x="2" y="2" width="624" height="35" fill="url(#tb)"/>
  <rect x="2" y="37" width="624" height="1" fill="#273047"/>
  <text x="16" y="25" fill="#cbd5e1" font-size="16" font-weight="700">bash &#x2014; sagah123</text>
  <text x="612" y="25" fill="#64748b" font-size="15" text-anchor="end">tty1</text>

  <!-- Inset terminal panel -->
  <rect x="12" y="48" width="604" height="348" fill="#080a10"/>
  <rect x="12" y="48" width="604" height="2" fill="#040508"/>
  <rect x="12" y="48" width="2" height="348" fill="#040508"/>
  <rect x="12" y="394" width="604" height="2" fill="#273047"/>
  <rect x="614" y="48" width="2" height="348" fill="#273047"/>

  <!-- User@Host header -->
  <text x="32" y="88" font-size="22" font-weight="700">
    <tspan fill="#00f0ff">sagah123</tspan><tspan fill="#64748b">@</tspan><tspan fill="#ff2a6d">fedora</tspan>
  </text>
  <line x1="32" y1="106" x2="596" y2="106" stroke="#273047" stroke-width="1"/>

  <!-- Bio lines -->
  <text x="32" y="142" fill="#fcee0a" font-size="16" font-weight="700">interests</text>
  <text x="136" y="142" fill="#64748b" font-size="16">::</text>
  <text x="168" y="142" fill="#e2e8f0" font-size="16">video games, programming,</text>
  <text x="168" y="168" fill="#e2e8f0" font-size="16">netstalking &amp; internet folklore</text>

  <text x="32" y="212" fill="#fcee0a" font-size="16" font-weight="700">exploring</text>
  <text x="136" y="212" fill="#64748b" font-size="16">::</text>
  <text x="168" y="212" fill="#e2e8f0" font-size="16">low-level, C++,</text>
  <text x="168" y="238" fill="#e2e8f0" font-size="16">embedded &amp; system design</text>

  <text x="32" y="282" fill="#fcee0a" font-size="16" font-weight="700">os</text>
  <text x="136" y="282" fill="#64748b" font-size="16">::</text>
  <text x="168" y="282" fill="#cbd5e1" font-size="16">Fedora Workstation / Windows</text>

  <!-- Bottom prompt -->
  <line x1="32" y1="336" x2="596" y2="336" stroke="#1e293b" stroke-dasharray="5 5"/>
  <text x="32" y="369" fill="#64748b" font-size="16">~/projects $ ls</text>
  <rect x="582" y="354" width="11" height="19" fill="#00f0ff" class="cur"/>

  <!-- Subtle scanlines -->
  <rect x="14" y="50" width="600" height="344" fill="url(#scan)"/>
</svg>

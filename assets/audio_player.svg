<svg xmlns="http://www.w3.org/2000/svg" width="888" height="106" viewBox="0 0 888 106" fill="none">
  <defs>
    <linearGradient id="tb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a233a"/>
      <stop offset="100%" stop-color="#0b0e18"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="none"/>
      <rect y="2" width="4" height="2" fill="#000000" fill-opacity="0.18"/>
    </pattern>
  </defs>
  <style>
    text { font-family: ui-monospace, 'Cascadia Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
    .led { animation: led 1.2s ease-in-out infinite; }
    @keyframes led { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    .eq0 { animation: eqA 0.85s ease-in-out infinite; }
    .eq1 { animation: eqB 0.72s ease-in-out 0.15s infinite; }
    .eq2 { animation: eqC 0.95s ease-in-out 0.30s infinite; }
    .eq3 { animation: eqA 0.78s ease-in-out 0.10s infinite; }
    .eq4 { animation: eqB 0.88s ease-in-out 0.28s infinite; }
    .eq5 { animation: eqC 0.82s ease-in-out 0.45s infinite; }
    .eq6 { animation: eqA 0.74s ease-in-out 0.08s infinite; }
    .eq7 { animation: eqB 0.91s ease-in-out 0.36s infinite; }
    .eq8 { animation: eqC 0.80s ease-in-out 0.22s infinite; }
    .eq9 { animation: eqA 0.94s ease-in-out 0.52s infinite; }
    @keyframes eqA { 0%, 100% { transform: scaleY(0.28); } 50% { transform: scaleY(0.95); } }
    @keyframes eqB { 0%, 100% { transform: scaleY(0.45); } 50% { transform: scaleY(0.20); } 75% { transform: scaleY(0.88); } }
    @keyframes eqC { 0%, 100% { transform: scaleY(0.22); } 40% { transform: scaleY(0.82); } 70% { transform: scaleY(0.40); } }
  </style>
  <!-- Window outer fill & 2px Win95 bevel -->
  <rect width="888" height="106" fill="#121320"/>
  <rect x="0" y="0" width="888" height="2" fill="#273047"/>
  <rect x="0" y="0" width="2" height="106" fill="#273047"/>
  <rect x="0" y="104" width="888" height="2" fill="#06070c"/>
  <rect x="886" y="0" width="2" height="106" fill="#06070c"/>

  <!-- Titlebar -->
  <rect x="2" y="2" width="884" height="26" fill="url(#tb)"/>
  <rect x="2" y="27" width="884" height="1" fill="#273047"/>
  <rect x="12" y="11" width="8" height="8" fill="#ff2a6d" class="led"/>
  <text x="28" y="19" fill="#cbd5e1" font-size="12" font-weight="700">audio_player.exe</text>
  <text x="876" y="19" fill="#64748b" font-size="11" text-anchor="end">DEADBOLT OST // CLICK TO OPEN</text>

  <!-- Inset panel -->
  <rect x="10" y="34" width="868" height="62" fill="#080a10"/>
  <rect x="10" y="34" width="868" height="2" fill="#040508"/>
  <rect x="10" y="34" width="2" height="62" fill="#040508"/>
  <rect x="10" y="94" width="868" height="2" fill="#273047"/>
  <rect x="876" y="34" width="2" height="62" fill="#273047"/>
  <!-- Beveled Play icon -->
  <rect x="24" y="45" width="40" height="40" fill="#1a1c2e"/>
  <rect x="24" y="45" width="40" height="2" fill="#334155"/>
  <rect x="24" y="45" width="2" height="40" fill="#334155"/>
  <rect x="24" y="83" width="40" height="2" fill="#06070c"/>
  <rect x="62" y="45" width="2" height="40" fill="#06070c"/>
  <g transform="translate(36, 57)" shape-rendering="crispEdges">
    <rect x="2" y="0" width="2" height="16" fill="#00f0ff"/>
    <rect x="4" y="2" width="2" height="12" fill="#00f0ff"/>
    <rect x="6" y="3" width="2" height="10" fill="#00f0ff"/>
    <rect x="8" y="5" width="2" height="6" fill="#00f0ff"/>
    <rect x="10" y="7" width="2" height="2" fill="#00f0ff"/>
  </g>
  <text x="80" y="61" fill="#00f0ff" font-size="16" font-weight="700">Ashes to Ashes to Ashes</text>
  <text x="80" y="80" fill="#94a3b8" font-size="13">Chris Christodoulou // DEADBOLT OST</text>
  <rect x="732" y="43" width="132" height="44" fill="#05070b" stroke="#1e293b"/>
  <g transform="translate(740, 81)"><rect x="0" y="-32" width="8" height="32" fill="#00f0ff" class="eq0"/></g>
  <g transform="translate(752, 81)"><rect x="0" y="-32" width="8" height="32" fill="#00f0ff" class="eq1"/></g>
  <g transform="translate(764, 81)"><rect x="0" y="-32" width="8" height="32" fill="#ff2a6d" class="eq2"/></g>
  <g transform="translate(776, 81)"><rect x="0" y="-32" width="8" height="32" fill="#00f0ff" class="eq3"/></g>
  <g transform="translate(788, 81)"><rect x="0" y="-32" width="8" height="32" fill="#fcee0a" class="eq4"/></g>
  <g transform="translate(800, 81)"><rect x="0" y="-32" width="8" height="32" fill="#00f0ff" class="eq5"/></g>
  <g transform="translate(812, 81)"><rect x="0" y="-32" width="8" height="32" fill="#ff2a6d" class="eq6"/></g>
  <g transform="translate(824, 81)"><rect x="0" y="-32" width="8" height="32" fill="#00f0ff" class="eq7"/></g>
  <g transform="translate(836, 81)"><rect x="0" y="-32" width="8" height="32" fill="#fcee0a" class="eq8"/></g>
  <g transform="translate(848, 81)"><rect x="0" y="-32" width="8" height="32" fill="#00f0ff" class="eq9"/></g>
  <rect x="12" y="36" width="864" height="58" fill="url(#scan)"/>
</svg>
